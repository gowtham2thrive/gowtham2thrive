<svg xmlns="http://www.w3.org/2000/svg" width="850" height="200">
  <defs>
    <radialGradient id="grad1" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#a18cd1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#a18cd1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="grad2" cx="80%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#fbc2eb" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fbc2eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="grad3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#84fab0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#84fab0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="100%" height="100%" fill="#0d1117" rx="15" />
  
  <circle cx="150" cy="50" r="120" fill="url(#grad1)" />
  <circle cx="700" cy="150" r="150" fill="url(#grad2)" />
  <circle cx="450" cy="100" r="180" fill="url(#grad3)" />

  <rect x="20" y="20" width="810" height="160" rx="15" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
  
  <!-- Fallback for emojis on some OS -->
  <text x="50" y="90" font-size="40">📕</text>
  <text x="50" y="125" font-family="Arial, sans-serif" font-size="14" fill="#a3b3cc" font-weight="bold" text-anchor="middle" transform="translate(20, 0)">Book</text>
  
  <line x1="130" y1="40" x2="130" y2="160" stroke="rgba(255,255,255,0.1)" stroke-width="1" />

  <text x="160" y="65" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">Fear of Being Different</text>
  <text x="160" y="95" font-family="Arial, sans-serif" font-size="14" fill="#8b949e">May 21, 2026</text>
  <text x="160" y="130" font-family="Arial, sans-serif" font-size="15" fill="#c9d1d9">A book that challenges the fear of standing apart.</text>
  <text x="160" y="152" font-family="Arial, sans-serif" font-size="15" fill="#c9d1d9">Available in print & Kindle.</text>
</svg>