<svg xmlns="http://www.w3.org/2000/svg" width="850" height="150">
  <defs>
    <radialGradient id="grad1" cx="10%" cy="10%" r="50%">
      <stop offset="0%" stop-color="#4facfe" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="grad2" cx="90%" cy="90%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="100%" height="100%" fill="#0d1117" rx="15" />
  
  <circle cx="100" cy="30" r="150" fill="url(#grad1)" />
  <circle cx="750" cy="120" r="150" fill="url(#grad2)" />

  <rect x="20" y="20" width="810" height="110" rx="15" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
  
  <text x="50" y="55" font-family="Arial, sans-serif" font-size="18" fill="#c9d1d9">I'm a builder who refuses to stay in one lane. I write code, publish research, and</text>
  <text x="50" y="85" font-family="Arial, sans-serif" font-size="18" fill="#c9d1d9">author books — because impact doesn't come from doing one thing; it comes</text>
  <text x="50" y="115" font-family="Arial, sans-serif" font-size="18" fill="#c9d1d9">from connecting everything.</text>
